<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>拉黑审批 · 一体化安全态势感知平台</title>
<style>
  :root{--bg:#0f1420;--panel:#171d2b;--panel2:#1e2536;--line:#2a3346;--txt:#e6ebf5;--mut:#8b97ad;--acc:#3b82f6;--alert:#ef4444;--ok:#22c55e;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .links{margin-left:auto;display:flex;gap:12px;font-size:12px}
  header a{color:var(--mut);text-decoration:none}header a:hover{color:var(--acc)}
  .wrap{padding:16px 20px;display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{background:var(--acc);border:1px solid var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel2);border-color:var(--line);color:var(--txt);font-weight:500}
  button.ok{background:var(--ok);border-color:var(--ok)}
  button.no{background:var(--alert);border-color:var(--alert)}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px}
  .pill b{color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;background:var(--panel)}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
  .P0{color:#fff;background:var(--alert);border-color:var(--alert)}
  .P1{color:#fff;background:var(--warn);border-color:var(--warn)}
  .P2{color:#0f1420;background:#eab308;border-color:#eab308}
  .P3{color:#0f1420;background:#94a3b8;border-color:#94a3b8}
  .st{padding:1px 7px;border-radius:6px;font-size:11px;border:1px solid var(--line)}
  .st.pending_approval{color:var(--warn);border-color:var(--warn)}
  .st.executed{color:var(--ok);border-color:var(--ok)}
  .st.rejected{color:var(--mut)}
  .st.failed{color:var(--alert);border-color:var(--alert)}
  .st.reverted{color:var(--acc);border-color:var(--acc)}
  .ioc{color:var(--alert);font-size:11px}
  .muted{color:var(--mut)}
  .empty{color:var(--mut);padding:22px;text-align:center}
  .err{color:var(--alert)}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px}
  #detail{position:fixed;right:0;top:0;height:100%;width:560px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;display:none}
  #detail pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#cdd6e6}
  #detail .close{float:right}
</style>
</head>
<body>
<header>
  <h1>🚫 拉黑审批 · SOAR（人工确认）</h1>
  <div class="links">
    <a href="http://localhost:8088/index.html">统一检索</a>
    <a href="http://localhost:8088/assets.html">统一资产库</a>
    <a href="http://localhost:8005" target="_blank">Arkime 流量回溯</a>
    <a href="http://localhost:5601" target="_blank">OpenSearch Dashboards</a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <button id="gen">运行剧本 · 生成拉黑草稿</button>
      <button id="refresh" class="ghost">刷新</button>
      <span class="muted" style="font-size:12px">剧本自动生成草稿；<b>提交封禁必须由人工确认</b>，系统不会自动提交。</span>
    </div>
    <div class="stats" id="stats" style="margin-top:12px">
      <span class="pill muted">加载中…</span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>当前封禁规则（iptables 自定义链）</b>
      <span class="muted" style="font-size:12px" id="chainInfo"></span>
    </div>
    <div style="margin-top:10px" id="blocks"><span class="muted">—</span></div>
  </div>

  <div class="card" style="padding:0">
    <table>
      <thead><tr><th>创建时间</th><th>级别</th><th>规则</th><th>目标 IP</th><th>命中情报</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">—</td></tr></tbody>
    </table>
  </div>
</div>

<div id="detail">
  <button class="close ghost" onclick="document.getElementById('detail').style.display='none'">关闭</button>
  <h3 id="dt" style="margin-top:0">草稿详情</h3>
  <pre id="dj"></pre>
</div>

<script>
const SOAR = "http://localhost:8092";
const OS = "http://localhost:9200";
const LABEL = {pending_approval:"待审批",executed:"已提交封禁",rejected:"已驳回",failed:"落黑失败",reverted:"已解除"};
const OPERATOR = "lixd";

function fmt(ts){return ts? new Date(ts).toLocaleString("zh-CN",{hour12:false}) : "-";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function api(path, method="GET", body){
  const opt = {method, headers:{"Content-Type":"application/json"}};
  if(body) opt.body = JSON.stringify(body);
  const res = await fetch(SOAR+path, opt);
  const txt = await res.text();
  let data; try{ data = JSON.parse(txt);}catch(e){ data = {raw:txt}; }
  if(!res.ok && !data.error) data.error = "HTTP "+res.status;
  return {ok:res.ok, status:res.status, data};
}

async function load(){
  const rows = document.getElementById("rows");
  try{
    const {data} = await api("/soar/drafts?limit=100");
    const drafts = data.drafts || [];
    const c = {pending_approval:0,executed:0,rejected:0,failed:0,reverted:0};
    drafts.forEach(d=>{ c[d.status] = (c[d.status]||0)+1; });
    document.getElementById("stats").innerHTML =
      `<span class="pill">草稿总数 <b>${drafts.length}</b></span>`+
      `<span class="pill">待审批 <b>${c.pending_approval}</b></span>`+
      `<span class="pill">已提交封禁 <b>${c.executed}</b></span>`+
      `<span class="pill">已驳回 <b>${c.rejected}</b></span>`+
      `<span class="pill">落黑失败 <b>${c.failed}</b></span>`;
    rows.innerHTML = drafts.length ? drafts.map(d=>{
      const ioc = d.threat && d.threat.matched
        ? `<span class="ioc">${esc(d.threat.value||"命中")}</span>` : `<span class="muted">未匹配</span>`;
      const canAct = d.status==="pending_approval" || d.status==="failed";
      return `<tr>
        <td>${fmt(d.created_at)}</td>
        <td><span class="tag ${d.grade}">${esc(d.grade)}</span></td>
        <td>${esc(d.rule_id)} ${esc(d.rule_name||"")}</td>
        <td><code>${esc(d.target_ip)}</code></td>
        <td>${ioc}</td>
        <td><span class="st ${d.status}">${LABEL[d.status]||d.status}</span></td>
        <td>
          <button class="ghost" onclick='showDetail(${JSON.stringify(JSON.stringify(d))})'>详情</button>
          <button class="ok" ${canAct?"":"disabled"} onclick="act('${d.draft_id}','approve')">通过</button>
          <button class="no" ${canAct?"":"disabled"} onclick="act('${d.draft_id}','reject')">驳回</button>
        </td></tr>`;
    }).join("") : '<tr><td colspan="7" class="empty">暂无草稿，点上方「运行剧本」生成</td></tr>';
  }catch(e){
    rows.innerHTML = `<tr><td colspan="7" class="empty err">加载失败：${esc(e.message)}<br>（确认 SOAR 服务 8092 已启动、CORS 已开启）</td></tr>`;
  }
}

async function loadBlocks(){
  try{
    const {data} = await api("/soar/blocks");
    document.getElementById("chainInfo").textContent = `chain=${data.chain||"-"} exists=${data.exists}`;
    const rules = data.rules || [];
    document.getElementById("blocks").innerHTML = rules.length
      ? rules.map(r=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0">
          <span><code>${esc(r.spec)}</code></span>
          <button class="ghost" onclick="unblock('${esc(r.ip)}')">解除封禁</button></div>`).join("")
      : '<span class="muted">当前无封禁规则</span>';
  }catch(e){
    document.getElementById("blocks").innerHTML = `<span class="err">读取失败：${esc(e.message)}</span>`;
  }
}

async function act(id, kind){
  const verb = kind==="approve" ? "通过并执行落黑（iptables）" : "驳回";
  if(!confirm(`确认${verb}？草稿 ${id}`)) return;
  const {data, ok} = await api(`/soar/drafts/${id}/${kind}`, "POST", {operator:OPERATOR});
  if(!ok && data.error) alert(data.error + (data.block && data.block.error ? "\n"+data.block.error : ""));
  load(); loadBlocks();
}

async function unblock(ip){
  if(!confirm(`确认解除对 ${ip} 的封禁？`)) return;
  await api("/soar/blocks/remove", "POST", {ip, operator:OPERATOR});
  load(); loadBlocks();
}

function showDetail(json){
  document.getElementById("dj").textContent = JSON.stringify(JSON.parse(json), null, 2);
  document.getElementById("detail").style.display="block";
}

document.getElementById("refresh").onclick = ()=>{ load(); loadBlocks(); };
document.getElementById("gen").onclick = async ()=>{
  const {data} = await api("/soar/drafts/generate","POST",{});
  alert(`剧本已运行：新增草稿 ${data.created_count||0}，跳过 ${(data.skipped||[]).length}。\n（草稿不会自动提交，请在列表中人工审批）`);
  load();
};
load(); loadBlocks();
</script>
</body>
</html>
