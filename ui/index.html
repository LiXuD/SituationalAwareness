<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>统一检索 · 一体化安全态势感知平台</title>
<style>
  :root{--bg:#0f1420;--panel:#171d2b;--panel2:#1e2536;--line:#2a3346;--txt:#e6ebf5;--mut:#8b97ad;--acc:#3b82f6;--alert:#ef4444;--ok:#22c55e;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .links{margin-left:auto;display:flex;gap:12px;font-size:12px}
  header a{color:var(--mut);text-decoration:none}header a:hover{color:var(--acc)}
  .wrap{padding:16px 20px;display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  input,select,button{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px}
  button{background:var(--acc);border-color:var(--acc);color:#fff;cursor:pointer;font-weight:600;margin-top:14px}
  button:hover{filter:brightness(1.1)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px}
  .pill b{color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--panel)}
  tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
  .tag.alert{color:#fff;background:var(--alert);border-color:var(--alert)}
  .tag.suricata{color:#93c5fd}.tag.zeek{color:#5eead4}.tag.wazuh{color:#fdba74}
  .muted{color:var(--mut)}
  #detail{position:fixed;right:0;top:0;height:100%;width:520px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;display:none}
  #detail pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#cdd6e6}
  #detail .close{float:right;width:auto;margin:0;padding:2px 10px;background:var(--panel2);border:1px solid var(--line)}
  .empty{color:var(--mut);padding:24px;text-align:center}
  .err{color:var(--alert)}
</style>
</head>
<body>
<header>
  <h1>🛡 统一检索 · 一体化安全态势感知平台</h1>
  <!-- 统一导航由 assets/nav.js 注入（同站多页，不再外跳第三方控制台） -->
</header>

<div class="wrap">
  <div class="card">
    <label>时间范围</label>
    <select id="range">
      <option value="15m">最近 15 分钟</option>
      <option value="1h" selected>最近 1 小时</option>
      <option value="24h">最近 24 小时</option>
      <option value="7d">最近 7 天</option>
      <option value="all">全部</option>
    </select>
    <label>关键字（规则/URL/域名/文件/原始日志）</label>
    <input id="kw" placeholder="如 evil-c2 / payload.bin"/>
    <label>来源 (event.module)</label>
    <select id="module">
      <option value="">全部</option>
      <option value="suricata">Suricata</option>
      <option value="zeek">Zeek</option>
      <option value="wazuh">Wazuh</option>
    </select>
    <label>事件类型 (event.kind)</label>
    <select id="kind">
      <option value="">全部</option>
      <option value="alert">alert 告警</option>
      <option value="event">event 事件</option>
    </select>
    <label>源 IP</label>
    <input id="sip" placeholder="如 203.0.113.45"/>
    <label>目的 IP</label>
    <input id="dip" placeholder="如 8.8.8.8"/>
    <button id="go">检索</button>
  </div>

  <div>
    <div class="stats" id="stats"><span class="pill muted">输入条件后点「检索」</span></div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>时间</th><th>来源</th><th>类型</th><th>源</th><th>目的</th><th>规则 / 摘要</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">—</td></tr></tbody>
      </table>
    </div>
    <div class="stats" style="margin-top:12px">
      <span class="pill muted">检索目标：别名 <b>ssp-events</b>（跨 Suricata / Zeek / Wazuh 归一事件）</span>
    </div>
  </div>
</div>

<div id="detail">
  <button class="close" onclick="document.getElementById('detail').style.display='none'">关闭</button>
  <h3 id="dt" style="margin-top:0">事件详情</h3>
  <pre id="dj"></pre>
</div>

<script>
const OS = "http://localhost:9200";
const RANGES = {"15m":"now-15m","1h":"now-1h","24h":"now-24h","7d":"now-7d","all":null};

function buildQuery(){
  const must=[], filter=[];
  const r = RANGES[document.getElementById("range").value];
  if(r) filter.push({range:{"@timestamp":{"gte":r}}});
  const kw = document.getElementById("kw").value.trim();
  if(kw) must.push({query_string:{query:kw,fields:["rule.name^3","rule.description","url.full","url.domain","dns.question.name","file.name","file.hash.sha256","log.original","event.module"]}});
  const m = document.getElementById("module").value; if(m) filter.push({term:{"event.module":m}});
  const k = document.getElementById("kind").value; if(k) filter.push({term:{"event.kind":k}});
  const sip = document.getElementById("sip").value.trim(); if(sip) filter.push({term:{"source.ip":sip}});
  const dip = document.getElementById("dip").value.trim(); if(dip) filter.push({term:{"destination.ip":dip}});
  const q = {bool:{must: must.length?must:[{match_all:{}}], filter}};
  return {
    size: 50,
    sort: [{"@timestamp":"desc"}],
    query: q,
    aggs: { by_module:{terms:{field:"event.module"}}, by_kind:{terms:{field:"event.kind"}} },
    _source: ["@timestamp","event.module","event.kind","event.category","source.ip","source.port","destination.ip","destination.port","rule.name","rule.description","url.full","dns.question.name","file.name","host.name","source.geo"]
  };
}

function fmt(ts){return ts? new Date(ts).toLocaleString("zh-CN",{hour12:false}) : "-";}

async function search(){
  const rows = document.getElementById("rows");
  const stats = document.getElementById("stats");
  rows.innerHTML = '<tr><td colspan="6" class="empty">检索中…</td></tr>';
  try{
    const res = await fetch(OS + "/ssp-events/_search", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(buildQuery())});
    const data = await res.json();
    if(!res.ok){ throw new Error(JSON.stringify(data.error||data)); }
    const total = data.hits.total.value ?? data.hits.total;
    const agg = data.aggregations || {};
    stats.innerHTML =
      `<span class="pill">命中 <b>${total}</b></span>` +
      Object.entries(agg).map(([k,v])=>
        `${v.buckets.map(b=>`<span class="pill">${k.replace("by_","")} ${b.key}: <b>${b.doc_count}</b></span>`).join("")}`
      ).join("");
    // 平台内下钻：外网 IP 一键查流量（跳转本平台「流量回溯」页，带入 IP 与时间窗）
    const PRIV = /^(10\.|127\.|169\.254\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|203\.0\.113\.|198\.51\.100\.|192\.0\.2\.)/;
    const isExt = ip => !!ip && !PRIV.test(ip) && ip!=="8.8.8.8";
    const win = ts => { if(!ts) return ""; const t=new Date(ts).getTime(); if(isNaN(t)) return "";
      return `&start=${t-300000}&end=${t+300000}`; };
    const flow = (ip, ts) => isExt(ip)
      ? ` <a href="traffic.html?ip=${encodeURIComponent(ip)}${win(ts)}" onclick="event.stopPropagation()" title="在平台内查看该 IP 的流量会话（不跳第三方控制台）" style="color:#38bdf8;text-decoration:none">⇄</a>`
      : "";
    rows.innerHTML = data.hits.hits.length ? data.hits.hits.map(h=>{
      const s=h._source, mod=s.event?.module||"", kind=s.event?.kind||"";
      const summary = s.rule?.name || s.rule?.description || s.url?.full || s.dns?.question?.name || s.file?.name || s["log.original"] || s.event?.category || "";
      return `<tr onclick='showDetail(${JSON.stringify(JSON.stringify(s))})'>
        <td>${fmt(s["@timestamp"])}</td>
        <td><span class="tag ${mod}">${mod}</span></td>
        <td><span class="tag ${kind==="alert"?"alert":""}">${kind}</span></td>
        <td>${s.source?.ip||"-"}${s.source?.port?":"+s.source.port:""}${flow(s.source?.ip, s["@timestamp"])}</td>
        <td>${s.destination?.ip||"-"}${s.destination?.port?":"+s.destination.port:""}${flow(s.destination?.ip, s["@timestamp"])}</td>
        <td title="${summary}">${summary}</td>
      </tr>`;
    }).join("") : '<tr><td colspan="6" class="empty">无结果</td></tr>';
  }catch(e){
    rows.innerHTML = `<tr><td colspan="6" class="empty err">检索失败：${e.message}<br>（确认栈已启动、别名 ssp-events 存在、OpenSearch CORS 已开启）</td></tr>`;
  }
}

function showDetail(json){
  document.getElementById("dj").textContent = JSON.stringify(JSON.parse(json), null, 2);
  document.getElementById("detail").style.display="block";
}

document.getElementById("go").onclick = search;
document.getElementById("kw").addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });
</script>
<script src="assets/nav.js"></script>
</body>
</html>
