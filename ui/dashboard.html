<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>态势大屏 · 一体化安全态势感知平台</title>
<style>
  :root{--bg:#0b0f18;--panel:#141a28;--panel2:#1b2333;--line:#273147;--txt:#e6ebf5;--mut:#8b97ad;
        --p0:#ef4444;--p1:#f59e0b;--p2:#3b82f6;--p3:#64748b;--ok:#22c55e;--acc:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:13px/1.45 -apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif}
  header{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
         gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,#131c2e,#0b0f18)}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
  header h1 span{color:var(--acc)}
  .links{margin-left:auto;display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
  .links a{color:var(--mut);text-decoration:none}
  .links a:hover{color:var(--acc)}
  .ctrl{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
  .ctrl select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
               border-radius:6px;padding:4px 8px;font-size:12px}
  #clock{font-variant-numeric:tabular-nums;min-width:150px;text-align:right}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:12px 18px 2px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .kpi .lab{font-size:11px;color:var(--mut);letter-spacing:.4px}
  .kpi .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .kpi .val small{font-size:12px;color:var(--mut);font-weight:400}

  .grid{display:grid;grid-template-columns:1.45fr 1fr;grid-template-rows:auto auto;gap:12px;
        padding:12px 18px 20px}
  @media (max-width:1100px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
         min-height:150px;display:flex;flex-direction:column}
  .panel h2{font-size:13px;margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .panel h2 .no{color:var(--acc)}
  .panel h2 .sub{font-size:11px;color:var(--mut);font-weight:400}
  .panel h2 .tag{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400}

  .mapwrap{position:relative;flex:1;min-height:300px}
  svg#map{width:100%;height:100%;display:block}
  #basemap path{fill:#1e2a3f;stroke:#31405c;stroke-width:.6}
  .grat{stroke:#1b2436;stroke-width:.5}
  .mk{cursor:default}
  .maplegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:11px;color:var(--mut)}
  .maplegend b{color:var(--txt);font-weight:600}

  .bar{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px}
  .row{display:grid;grid-template-columns:66px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
  .row .k{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .n{text-align:right;font-variant-numeric:tabular-nums}
  .sec{font-size:11px;color:var(--mut);margin:10px 0 4px;letter-spacing:.3px;
       border-bottom:1px dashed var(--line);padding-bottom:3px}
  .sec:first-child{margin-top:0}

  .heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;overflow:auto;
        max-height:230px}
  .cell{border-radius:8px;padding:6px 7px;border:1px solid var(--line);font-size:11px;line-height:1.3}
  .cell .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .ip{color:var(--mut);font-size:10px;font-variant-numeric:tabular-nums}
  .cell .imp{font-size:10px;margin-top:2px;opacity:.9}
  .cell.core{border-color:#f59e0b;border-width:2px}
  .badge{display:inline-block;padding:0 5px;border-radius:4px;font-size:10px;border:1px solid var(--line)}

  table.sla{width:100%;border-collapse:collapse;font-size:12px}
  table.sla th,table.sla td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);
                            font-variant-numeric:tabular-nums}
  table.sla th{color:var(--mut);font-weight:600;text-align:right;font-size:11px}
  table.sla td:first-child,table.sla th:first-child{text-align:left}
  .empty{color:var(--mut);padding:18px;text-align:center;font-size:12px}
  .err{color:var(--p0)}
  .note{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.5}
  .lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<header>
  <h1>🛡 态势大屏 · <span>一体化安全态势感知平台</span></h1>
  <div class="ctrl">
    <select id="range">
      <option value="1h">最近 1 小时</option>
      <option value="24h">最近 24 小时</option>
      <option value="7d">最近 7 天</option>
      <option value="all" selected>全部</option>
    </select>
    <span id="clock"></span>
    <span id="src-health" style="margin-left:4px" title="探针数据源健康（PRD §10：断连时标记异常，不影响其他源）"></span>
  </div>
  <div class="links">
    <a href="http://localhost:8088/index.html">统一检索</a>
    <a href="http://localhost:8088/assets.html">统一资产库</a>
    <a href="http://localhost:8088/soar.html">拉黑审批</a>
    <a href="http://localhost:8005" target="_blank">Arkime 流量回溯</a>
    <a href="http://localhost:5601" target="_blank">OpenSearch Dashboards</a>
  </div>
</header>

<div class="kpis" id="kpis"><div class="kpi"><div class="lab">加载中…</div></div></div>

<div class="grid">
  <section class="panel">
    <h2><span class="no">①</span> 攻击地图 <span class="sub">按外网 IP 地理定位聚合告警（散点大小＝告警数）</span>
      <span class="tag" id="map-tag"></span></h2>
    <div class="mapwrap">
      <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <g id="grat"></g>
        <g id="basemap"></g>
        <g id="points"></g>
      </svg>
    </div>
    <div class="maplegend" id="map-legend"></div>
  </section>

  <section class="panel">
    <h2><span class="no">②</span> 告警 TOP <span class="sub">级别 / 规则 / 资产</span></h2>
    <div id="top"></div>
  </section>

  <section class="panel">
    <h2><span class="no">③</span> 资产热力 <span class="sub">重要度 × 风险评分</span>
      <span class="tag" id="heat-tag"></span></h2>
    <div class="heat" id="heat"></div>
    <div class="note" id="heat-note"></div>
  </section>

  <section class="panel">
    <h2><span class="no">④</span> SLA 达成率 <span class="sub">实际响应时延 ≤ 级别阈值</span></h2>
    <div id="sla"></div>
    <div class="note" id="sla-note"></div>
  </section>
</div>

<script>
const OS = "http://localhost:9200";
const CORR = "http://localhost:8091";
const ALERTS = "ssp-alerts";
const ASSETS = "ssp-assets";
const GRADES = ["P0","P1","P2","P3"];
const GCOLOR = {P0:"#ef4444",P1:"#f59e0b",P2:"#3b82f6",P3:"#64748b"};
const GLABEL = {P0:"秒级",P1:"1 分钟",P2:"10 分钟",P3:"30 分钟"};
const SLA_DEFAULT = {P0:30,P1:60,P2:600,P3:1800};
const W = 1000, H = 500;
const RANGES = {"1h":"now-1h","24h":"now-24h","7d":"now-7d","all":null};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function proj(lon,lat){return [(lon+180)/360*W, (90-lat)/180*H];}
function fmtTs(t){if(!t)return "-";const d=new Date(t);return d.toLocaleString("zh-CN",{hour12:false});}

function parseGeo(g){
  if(!g) return null;
  if(Array.isArray(g) && g.length===2){          // OpenSearch 常把 geo_point 存成 [lon,lat]
    const [a,b]=g; return (Math.abs(a)>90)?{lon:a,lat:b}:{lon:b,lat:a};
  }
  if(typeof g==="object"){
    if(g.location) return parseGeo(g.location);
    if(typeof g.lat==="number" && typeof g.lon==="number") return {lat:g.lat,lon:g.lon};
    if(typeof g.latitude==="number" && typeof g.longitude==="number") return {lat:g.latitude,lon:g.longitude};
  }
  if(typeof g==="string" && g.indexOf(",")>0){
    const [a,b]=g.split(",").map(Number);
    if(isFinite(a)&&isFinite(b)) return (Math.abs(a)>90)?{lat:b,lon:a}:{lat:a,lon:b};
  }
  return null;
}

async function q(index, body){
  const r = await fetch(OS+"/"+index+"/_search", {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok) throw new Error(JSON.stringify(d.error||d));
  return d;
}

function rangeFilter(){
  const r = RANGES[document.getElementById("range").value];
  return r ? [{range:{"@timestamp":{"gte":r}}}] : [];
}

/* ------------------------------ ② 告警 TOP ------------------------------ */
function renderTop(alerts){
  const byGrade={}, byRule={}, byAsset={};
  for(const a of alerts){
    const al=a.ssp&&a.ssp.alert||{}, g=al.grade||"P3";
    byGrade[g]=(byGrade[g]||0)+1;
    const rk=al.rule_id||"?"; byRule[rk]=(byRule[rk]||0)+1;
    const ak=(a.asset&&a.asset.name)||(a.related&&a.related.entities&&a.related.entities.internal_ips||[])[0]||"—";
    byAsset[ak]=(byAsset[ak]||0)+1;
  }
  const topN=(o,n)=>Object.entries(o).sort((x,y)=>y[1]-x[1]).slice(0,n);
  const maxG=Math.max(1,...Object.values(byGrade));
  const maxR=Math.max(1,...Object.values(byRule));

  let h='<div class="sec">按级别分布</div>';
  h+=GRADES.map(g=>{
    const v=byGrade[g]||0;
    return `<div class="row"><span class="k"><span class="dot" style="background:${GCOLOR[g]}"></span> ${g} <span style="color:var(--mut)">${GLABEL[g]}</span></span>
      <span class="bar"><i style="width:${Math.round(v/maxG*100)}%;background:${GCOLOR[g]}"></i></span>
      <span class="n">${v}</span></div>`;
  }).join("");

  h+='<div class="sec">规则命中 TOP 5</div>';
  h+=topN(byRule,5).map(([k,v])=>`<div class="row"><span class="k" title="${esc(k)}">${esc(k)}</span>
      <span class="bar"><i style="width:${Math.round(v/maxR*100)}%;background:var(--acc)"></i></span>
      <span class="n">${v}</span></div>`).join("") || '<div class="empty">—</div>';

  h+='<div class="sec">受影响资产 TOP 5</div>';
  h+=topN(byAsset,5).map(([k,v])=>`<div class="row"><span class="k" title="${esc(k)}">${esc(k)}</span>
      <span class="bar"><i style="width:${Math.round(v/maxR*100)}%;background:var(--p1)"></i></span>
      <span class="n">${v}</span></div>`).join("") || '<div class="empty">—</div>';
  document.getElementById("top").innerHTML=h;
}

/* ------------------------------ ③ 资产热力 ------------------------------ */
function riskColor(s){
  s=Math.max(0,Math.min(100,Number(s)||0));
  const hue=(1-s/100)*120;                       // 0=红(高危) 120=绿(低危)
  return `hsl(${hue},62%,${18+ s*0.14}%)`;
}
function renderHeat(assets, alerts){
  const hit={};
  for(const a of alerts){
    const ip=(a.asset&&a.asset.ip)||((a.related&&a.related.entities&&a.related.entities.internal_ips)||[])[0];
    if(ip) hit[ip]=(hit[ip]||0)+1;
  }
  const list=assets.slice().sort((a,b)=>(b.risk_score||0)-(a.risk_score||0));
  document.getElementById("heat-tag").textContent=`共 ${assets.length} 项`;
  document.getElementById("heat").innerHTML = list.map(a=>{
    const core=a.importance==="核心";
    const n=hit[a.ip]||0;
    return `<div class="cell ${core?"core":""}" style="background:${riskColor(a.risk_score)}"
              title="${esc(a.name)} · ${esc(a.ip)} · 重要度 ${esc(a.importance)} · 风险 ${esc(a.risk_score)} · 命中告警 ${n}">
      <div class="nm">${esc(a.name)}</div>
      <div class="ip">${esc(a.ip)}</div>
      <div class="imp">${esc(a.importance)} · 风险 ${esc(a.risk_score)}${n?` · <b style="color:#fff">${n} 告警</b>`:""}</div>
    </div>`;
  }).join("") || '<div class="empty">资产库为空</div>';
  document.getElementById("heat-note").innerHTML =
    '<span class="lg"><i class="dot" style="background:#ef4444"></i>高风险</span>'+
    '<span class="lg"><i class="dot" style="background:#eab308"></i>中风险</span>'+
    '<span class="lg"><i class="dot" style="background:#22c55e"></i>低风险</span>'+
    '<span class="lg" style="color:#f59e0b">▢ 金色描边＝核心资产</span>。块内 "<b>N 告警</b>" 为该资产被命中告警数。';
}

/* ------------------------------ ④ SLA ------------------------------ */
function slaOf(a, now){
  const al=(a.ssp&&a.ssp.alert)||{};
  const grade=al.grade||"P3";
  const thr=(typeof al.sla_seconds==="number")?al.sla_seconds:(SLA_DEFAULT[grade]||1800);
  const gen=new Date(al.generated_at||a["@timestamp"]).getTime();
  const res=al.resolved_at?new Date(al.resolved_at).getTime():null;
  let state, latency=null;
  if(res){ latency=Math.round((res-gen)/1000); state = latency<=thr?"met":"breached"; }
  else {
    const due=al.due_at?new Date(al.due_at).getTime():gen+thr*1000;
    state = now<=due ? "pending" : "breached";
  }
  return {grade, thr, state, latency, status:al.status||"open"};
}
function renderSla(alerts){
  const now=Date.now();
  const agg={}; GRADES.forEach(g=>agg[g]={total:0,met:0,breached:0,pending:0,resp:0});
  for(const a of alerts){const s=slaOf(a,now);const o=agg[s.grade]||(agg[s.grade]={total:0,met:0,breached:0,pending:0,resp:0});
    o.total++; o[s.state]++; if(s.latency!==null) o.resp++;}
  let met=0, judged=0;
  GRADES.forEach(g=>{met+=agg[g].met; judged+=agg[g].met+agg[g].breached;});
  document.getElementById("sla-rate").textContent = judged? Math.round(met/judged*100)+"%" : "—";

  let h='<table class="sla"><thead><tr><th>级别</th><th>阈值</th><th>告警</th><th>已响应</th><th>达标</th><th>超时</th><th>待响应</th><th>达成率</th></tr></thead><tbody>';
  h+=GRADES.map(g=>{
    const o=agg[g]; const den=o.met+o.breached; const rate=den?Math.round(o.met/den*100):null;
    const bar=rate===null?'<span style="color:var(--mut)">—</span>'
      :`<span style="display:inline-flex;align-items:center;gap:5px"><span class="bar" style="width:46px"><i style="width:${rate}%;background:${rate>=80?"var(--ok)":rate>=50?"var(--p1)":"var(--p0)"}"></i></span>${rate}%</span>`;
    return `<tr><td><span class="dot" style="background:${GCOLOR[g]}"></span> ${g} <span style="color:var(--mut)">${GLABEL[g]}</span></td>
      <td>${SLA_DEFAULT[g]}s</td><td>${o.total}</td><td>${o.resp}</td>
      <td>${o.met}</td><td>${o.breached}</td><td>${o.pending}</td><td>${bar}</td></tr>`;
  }).join("");
  h+="</tbody></table>";
  document.getElementById("sla").innerHTML=h;
  document.getElementById("sla-note").innerHTML =
    "达成率 = 达标 ÷（达标 + 超时）；「待响应」为尚未到截止时刻、不计入分母。<br>"+
    "PRD §12 口径 P0 秒级 / P1 1 分钟 / P2 10 分钟 / P3 30 分钟；POC 把「秒级」量化为可测的 30 秒。";
}

/* ------------------------------ ① 攻击地图 ------------------------------ */
async function loadBasemap(){
  const g=document.getElementById("basemap");
  if(g.dataset.loaded) return;
  try{
    const r=await fetch("assets/world-land.svg");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const svg=await r.text();
    const doc=new DOMParser().parseFromString(svg,"image/svg+xml");
    const p=doc.querySelector("path");
    if(!p) throw new Error("no path");
    g.appendChild(document.importNode(p,true));
    g.dataset.loaded="1";
  }catch(e){
    console.warn("底图加载失败，退化为经纬网",e);
    const gr=document.getElementById("grat");
    gr.insertAdjacentHTML("afterbegin",
      '<rect x="0" y="0" width="1000" height="500" fill="#141a28" stroke="#273147" stroke-width="1"/>');
  }
}
function drawGraticule(){
  const g=document.getElementById("grat"); let h="";
  for(let lon=-180;lon<=180;lon+=30){const [x]=proj(lon,0);h+=`<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;}
  for(let lat=-60;lat<=60;lat+=30){const [,y]=proj(0,lat);h+=`<line class="grat" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;}
  g.innerHTML=h;
}
function renderMap(alerts){
  const pts={};
  const add=(ip,geoRaw,grade)=>{
    if(!ip||!geoRaw) return;
    const loc=parseGeo(geoRaw);
    if(!loc) return;
    const o=pts[ip]||(pts[ip]={ip,lat:loc.lat,lon:loc.lon,n:0,grades:{},country:""});
    o.n++; o.grades[grade]=(o.grades[grade]||0)+1;
    o.country=geoRaw.country_name||geoRaw.country_iso_code||o.country||"";
  };
  for(const a of alerts){
    const grade=(a.ssp&&a.ssp.alert&&a.ssp.alert.grade)||"P3";
    const gp=(a.related&&a.related.geo_points)||[];
    if(gp.length){
      // 优先用关联引擎汇总的"外网侧地理点"（含 R-005 外联聚合的多个目的 IP）
      for(const p of gp) add(p.ip,p.geo,grade);
    }else{
      const s=a.source||{}, d=a.destination||{};
      add(s.ip,s.geo,grade);
      if(d.ip!==s.ip) add(d.ip,d.geo,grade);
    }
  }
  const arr=Object.values(pts);
  const maxN=Math.max(1,...arr.map(p=>p.n));
  const g=document.getElementById("points");
  g.innerHTML=arr.map(p=>{
    const [x,y]=proj(p.lon,p.lat);
    const gs=GRADES.filter(k=>p.grades[k]);
    const worst=gs[0]||"P3";
    const r=4+Math.round((p.n/maxN)*7);
    const tip=`${p.ip}${p.country?" · "+esc(p.country):""} · ${p.n} 条告警（${gs.map(k=>k+"×"+p.grades[k]).join(" ")}）`;
    return `<g class="mk"><title>${tip}</title>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r+5}" fill="${GCOLOR[worst]}" opacity="0.16"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${GCOLOR[worst]}" stroke="#fff" stroke-width=".8" opacity="0.95"/>
    </g>`;
  }).join("");
  document.getElementById("map-tag").textContent = arr.length? `${arr.length} 个外网 IP` : "无地理定位数据";
  const byCountry={};
  arr.forEach(p=>{const c=p.country||"未知"; byCountry[c]=(byCountry[c]||0)+p.n;});
  const top=Object.entries(byCountry).sort((a,b)=>b[1]-a[1]);
  document.getElementById("map-legend").innerHTML = top.length
    ? "来源国家/地区："+top.map(([c,n])=>`<b>${esc(c)}</b> ${n}`).join(" · ")
    : "暂无带地理坐标的告警（需 GeoIP 库 + 外网源 IP 事件）";
}

/* ------------------------------ 主流程 ------------------------------ */
async function load(){
  try{
    const rf=rangeFilter();
    const [alertsRes, assetsRes] = await Promise.all([
      q(ALERTS,{size:500,sort:[{"@timestamp":"desc"}],query:{bool:{filter:rf}}}),
      q(ASSETS,{size:500,query:{match_all:{}}})
    ]);
    const alerts = alertsRes.hits.hits.map(h=>h._source);
    const assets = assetsRes.hits.hits.map(h=>h._source);

    // 数据源健康（PRD §10：探针断连标记异常，不影响其它源）
    try{
      const hr=await fetch(CORR+"/sources/health");
      const hd=await hr.json();
      document.getElementById("src-health").innerHTML = "数据源 " + (hd.sources||[]).map(s=>{
        const c=s.state==="ok"?"var(--ok)":s.state==="stale"?"var(--p1)":"var(--p0)";
        const lab=s.state==="ok"?"正常":s.state==="stale"?("滞后"+Math.round((s.lag_seconds||0)/60)+"m"):"无数据";
        return `<span style="color:${c};margin-left:6px" title="${esc(s.source)}：${lab}｜事件 ${s.events}｜最新 ${esc(s.latest||'-')}">● ${esc(s.source)}</span>`;
      }).join("");
    }catch(e){ document.getElementById("src-health").textContent="数据源状态获取失败"; }

    const byGrade={}; let threat=0, blocked=0;
    for(const a of alerts){
      const g=(a.ssp&&a.ssp.alert&&a.ssp.alert.grade)||"P3";
      byGrade[g]=(byGrade[g]||0)+1;
      if(a.threat&&a.threat.matched) threat++;
      const st=a.ssp&&a.ssp.alert&&a.ssp.alert.status;
      if(st==="blocked") blocked++;
    }
    const geocount=Object.keys(alerts.reduce((m,a)=>{
      const gp=(a.related&&a.related.geo_points)||[];
      if(gp.length){ for(const p of gp){ if(p.ip&&parseGeo(p.geo)) m[p.ip]=1; } return m; }
      const s=parseGeo(a.source&&a.source.geo),d=parseGeo(a.destination&&a.destination.geo);
      if(s&&a.source.ip)m[a.source.ip]=1; if(d&&a.destination.ip)m[a.destination.ip]=1; return m;},{})).length;

    document.getElementById("kpis").innerHTML = [
      ["告警总数",alerts.length,""],
      ["<span style=\"color:"+GCOLOR.P0+"\">P0 秒级</span>",byGrade.P0||0,""],
      ["情报命中",threat,""],
      ["已拉黑",blocked,""],
      ["SLA 达成率","<span id=\"sla-rate\">—</span>",""],
      ["地理定位外网 IP",geocount,""],
      ["资产数",assets.length,""],
    ].map(([l,v])=>`<div class="kpi"><div class="lab">${l}</div><div class="val">${v}</div></div>`).join("");

    drawGraticule();
    await loadBasemap();
    renderMap(alerts);
    renderTop(alerts);
    renderHeat(assets,alerts);
    renderSla(alerts);
  }catch(e){
    document.getElementById("kpis").innerHTML=`<div class="kpi"><div class="lab err">加载失败</div>
      <div class="val" style="font-size:12px">${esc(e.message)}</div></div>`;
    console.error(e);
  }
}

function tick(){
  document.getElementById("clock").textContent = new Date().toLocaleString("zh-CN",{hour12:false});
}
document.getElementById("range").onchange = load;
tick(); load();
setInterval(load, 15000);
setInterval(tick, 1000);
</script>
</body>
