# Wazuh alerts.json → ECS 归一
# 职责：主机侧 HIDS/EDR 告警（登录审计、文件完整性、账号监控等）
filter {
  if [fields][log_source] == "wazuh" {
    json {
      source => "message"
      target => "wazuh"
      skip_on_invalid_json => true
    }

    if "_jsonparsefailure" not in [tags] {
      date {
        match => ["[wazuh][timestamp]", "ISO8601"]
        target => "@timestamp"
      }

      mutate {
        add_field => {
          "[event][module]"        => "wazuh"
          "[event][kind]"          => "alert"
          "[event][category]"      => "host"
          "[host][name]"           => "%{[wazuh][agent][name]}"
          "[host][ip]"             => "%{[wazuh][agent][ip]}"
          "[rule][id]"             => "%{[wazuh][rule][id]}"
          "[rule][description]"    => "%{[wazuh][rule][description]}"
          "[rule][category]"       => "%{[wazuh][rule][groups]}"
          "[event][severity]"      => "%{[wazuh][rule][level]}"
          "[observer][name]"       => "%{[wazuh][manager][name]}"
          "[log][original]"        => "%{[wazuh][full_log]}"
        }
      }

      if [wazuh][data][srcip] {
        mutate { add_field => { "[source][ip]" => "%{[wazuh][data][srcip]}" } }
        geoip {
          source => "[wazuh][data][srcip]"
          target => "[source][geo]"
          database => "/usr/share/logstash/geoip/dbip-city-lite.mmdb"
          tag_on_failure => ["_geoip_lookup_failure"]
        }
        # GeoIP 失败会残留空的 [source][geo]，geo_point 类型会拒绝空对象 → 移除
        if "_geoip_lookup_failure" in [tags] {
          mutate { remove_field => ["[source][geo]"] }
        }
      }
    }

    mutate { remove_field => ["message"] }
  }
}
