# 外部日志源 → ECS 归一（I-14 L2）
#
# 分工（计划 §五.5）：
#   services/ingest-adapter  只做「协议解析（syslog/CEF/JSON）+ 打标」，投递到 Kafka ssp-raw；
#   本文件                  做「ECS 归一」，与 10/20/30-*.conf 对探针源的归一职责一致。
#
# 新增一类外部源只需：① 起一个适配器实例（或复用现有入口）② 必要时在此加一条方言解析。
# 中心端口、Kafka 汇聚层、下游索引命名规则(`ssp-<log_source>-日期`)、检索别名、关联引擎
# 都**不需要改**。
#
# @timestamp 口径：外部源统一取「事件进入适配器的时刻」（流式实时性优先，避免设备日志
# 时钟漂移/无年份导致 date 解析出错）；设备原始时间保留在 ssp.external.parsed.timestamp。
filter {
  if [fields][log_source] in ["firewall", "waf", "ids", "proxy"] {
    # ---------- 通用：归一为 ECS 事件 ----------
    mutate {
      add_field => {
        "[event][kind]"      => "alert"
        "[event][category]"  => "network"
        "[event][module]"    => "%{[fields][log_source]}"
        "[event][dataset]"   => "%{[fields][log_source]}.external"
        "[observer][name]"   => "%{[fields][log_source]}"
        "[observer][type]"   => "external"
      }
    }

    # ---------- 方言一：JSON / syslog 入口的结构化字段（适配器已抽取）----------
    if [ssp][external][parsed][src_ip] {
      mutate { add_field => { "[source][ip]" => "%{[ssp][external][parsed][src_ip]}" } }
    }
    if [ssp][external][parsed][dst_ip] {
      mutate { add_field => { "[destination][ip]" => "%{[ssp][external][parsed][dst_ip]}" } }
    }
    if [ssp][external][parsed][src_port] {
      mutate { add_field => { "[source][port]" => "%{[ssp][external][parsed][src_port]}" } }
    }
    if [ssp][external][parsed][dst_port] {
      mutate { add_field => { "[destination][port]" => "%{[ssp][external][parsed][dst_port]}" } }
    }
    if [ssp][external][parsed][protocol] {
      mutate { add_field => { "[network][transport]" => "%{[ssp][external][parsed][protocol]}" } }
    }
    if [ssp][external][parsed][action] {
      mutate { add_field => { "[event][action]" => "%{[ssp][external][parsed][action]}" } }
    }
    if [ssp][external][parsed][rule_name] {
      mutate { add_field => { "[rule][name]" => "%{[ssp][external][parsed][rule_name]}" } }
    }
    if [ssp][external][parsed][rule_id] {
      mutate { add_field => { "[rule][id]" => "%{[ssp][external][parsed][rule_id]}" } }
    }
    if [ssp][external][parsed][severity] {
      mutate { add_field => { "[event][severity]" => "%{[ssp][external][parsed][severity]}" } }
    }
    if [ssp][external][parsed][vendor] {
      mutate { add_field => { "[observer][vendor]" => "%{[ssp][external][parsed][vendor]}" } }
    }
    if [ssp][external][parsed][product] {
      mutate { add_field => { "[observer][product]" => "%{[ssp][external][parsed][product]}" } }
    }
    if [ssp][external][parsed][device_version] {
      mutate { add_field => { "[observer][version]" => "%{[ssp][external][parsed][device_version]}" } }
    }

    # ---------- 方言二：CEF（适配器解析出 header + extension）----------
    if [ssp][external][parsed][extension] {
      if [ssp][external][parsed][name] {
        mutate { add_field => { "[rule][name]" => "%{[ssp][external][parsed][name]}" } }
      }
      if [ssp][external][parsed][signature_id] {
        mutate { add_field => { "[rule][id]" => "%{[ssp][external][parsed][signature_id]}" } }
      }
      if [ssp][external][parsed][device_vendor] {
        mutate { add_field => { "[observer][vendor]" => "%{[ssp][external][parsed][device_vendor]}" } }
      }
      if [ssp][external][parsed][device_product] {
        mutate { add_field => { "[observer][product]" => "%{[ssp][external][parsed][device_product]}" } }
      }
      if [ssp][external][parsed][extension][src] {
        mutate { add_field => { "[source][ip]" => "%{[ssp][external][parsed][extension][src]}" } }
      }
      if [ssp][external][parsed][extension][dst] {
        mutate { add_field => { "[destination][ip]" => "%{[ssp][external][parsed][extension][dst]}" } }
      }
      if [ssp][external][parsed][extension][spt] {
        mutate { add_field => { "[source][port]" => "%{[ssp][external][parsed][extension][spt]}" } }
      }
      if [ssp][external][parsed][extension][dpt] {
        mutate { add_field => { "[destination][port]" => "%{[ssp][external][parsed][extension][dpt]}" } }
      }
      if [ssp][external][parsed][extension][proto] {
        mutate { add_field => { "[network][transport]" => "%{[ssp][external][parsed][extension][proto]}" } }
      }
      if [ssp][external][parsed][extension][act] {
        mutate { add_field => { "[event][action]" => "%{[ssp][external][parsed][extension][act]}" } }
      }
    }

    # ---------- 方言三：syslog 自由文本（典型以 Cisco ASA 的 deny/allow 行）----------
    # 例：'%ASA-4-106023: Deny tcp src outside:203.0.113.77/41000 dst inside:10.0.0.20/445 ...'
    # 端口可缺省（如 'Deny udp src 203.0.113.88 dst 10.0.0.21'），故用可选组。
    if [message] =~ /src .+ dst / {
      grok {
        match => {
          "message" => "(?<ext_action>Deny|deny|DENY|DROP|drop|Allow|allow|ALLOW) %{WORD:[network][transport]} src (?:[^:\s]+:)?%{IP:[ext][src_ip]}(?:/%{POSINT:[ext][src_port]})? dst (?:[^:\s]+:)?%{IP:[ext][dst_ip]}(?:/%{POSINT:[ext][dst_port]})?"
        }
        tag_on_failure => ["_ext_grok_miss"]
      }
      if [ext][src_ip] {
        mutate { add_field => { "[source][ip]" => "%{[ext][src_ip]}"
                                "[destination][ip]" => "%{[ext][dst_ip]}" } }
      }
      if [ext][src_port] {
        mutate { add_field => { "[source][port]"      => "%{[ext][src_port]}"
                                "[destination][port]" => "%{[ext][dst_port]}" } }
      }
      if [ext_action] {
        mutate { add_field => { "[event][action]" => "%{[ext_action]}" } }
      }
      mutate { remove_field => ["ext", "ext_action"] }
    }

    # 归一后的类型收敛（ECS 数值端口）
    if [source][port] {
      mutate { convert => { "[source][port]" => "integer" } }
    }
    if [destination][port] {
      mutate { convert => { "[destination][port]" => "integer" } }
    }

    # 只保留统一命名的原始日志（原文），避免 message 字段在两套模板下含义漂移
    mutate { rename => { "message" => "[log][original]" } }
  }
}
