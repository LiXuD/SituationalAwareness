# 统一入口（I-13 多分支汇聚）
#
# 中心汇聚层：各分支边缘代理（Filebeat）把原始日志投递到 Kafka 的 ssp-raw 主题，
# 本管道从该主题消费后做 ECS 归一与入库。Kafka 即"多分支汇聚点"，
# 同时为 R-15 外部日志源适配器 / 未来流式关联预留统一入口。
#
# 兼容保留 beats(:5044) 直连入口：便于不经过 Kafka 的旁路/调试/R-15 适配器直接投递。
# 两条入口的事件结构一致（都带 fields.log_source / fields.branch），故下游 filter 无需区分。
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["ssp-raw"]
    group_id          => "ssp-logstash"
    client_id         => "ssp-logstash"
    auto_offset_reset => "earliest"
    codec             => json
    decorate_events   => false
    tags              => ["ssp-kafka"]
  }

  beats {
    port => 5044
    tags => ["ssp-beats"]
  }
}
