# 统一出口：按来源分索引写入 OpenSearch + **归一事件流的 Kafka 旁路**（I-14）
# 索引命名：ssp-<log_source>-YYYY.MM.dd
#   log_source ∈ suricata | zeek | wazuh（探针） | firewall | waf | ...（外部源，I-14 L2）
#
# I-14 为什么在这里加一个 Kafka 输出：
#   流式关联引擎（services/stream）需要"归一后的事件流"，而 `ssp-raw` 里是**归一前**的原始日志。
#   若由流式引擎自行解析原始日志，就等于把 I-01 的 ECS 归一逻辑再实现一遍 —— 正是
#   docs/I-14-...-计划.md §八 风险表里"流式与批式规则实现分叉"的来源。
#   因此这里让 Logstash **双写**：OpenSearch（检索 / 批式关联）+ Kafka `ssp-ecs`（流式关联）。
#   两条通道拿到的是同一份 ECS 文档 → 两侧共用 services/common/ssp_kernel.py 的同一份规则实现，
#   口径天然一致；且流式不必等 OpenSearch 的 refresh（1s）即可看到事件，时延更低。
#
# 注：Kafka 本就是本管线的输入依赖（00-inputs.conf），此输出不新增外部依赖；
#     输出失败按客户端策略重试。
output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "ssp-%{[fields][log_source]}-%{+YYYY.MM.dd}"
    manage_template => false
  }

  kafka {
    bootstrap_servers => "kafka:9092"
    topic_id          => "ssp-ecs"
    codec             => json
    compression_type  => "gzip"
    acks              => "1"
    client_id         => "ssp-logstash-ecs"
    retries           => 5
    linger_ms         => 5
  }
}
