# 分支身份打标（I-13 多分支汇聚）
#
# 职责：把边缘代理带过来的 fields.branch 提升为平台统一字段 ssp.branch，
#       供检索、聚合、大屏、分支健康探测使用。
# 兼容：未携带 branch 的存量链路（含直接经 beats 入口投递）一律归入总部 hq，
#       保证升级不改变既有数据的归属语义。
#
# 说明：本文件按文件名排序在 10/20/30-*.conf（ECS 归一）之前执行，
#       但两者互不干扰——这里只做"字段提升"，不改探针字段映射。
filter {
  if [fields][branch] {
    mutate { add_field => { "[ssp][branch]" => "%{[fields][branch]}" } }
  } else {
    mutate { add_field => { "[ssp][branch]" => "hq" } }
  }

  if [fields][branch_site] {
    mutate { add_field => { "[ssp][branch_site]" => "%{[fields][branch_site]}" } }
  }
}
