# Zeek 日志（JSON 行）→ ECS 归一
# 职责：会话/协议行为上下文，用于溯源、狩猎、资产测绘
# 说明：Zeek JSON 使用点号扁平键（如 id.orig_h）。Logstash 字段引用中，
#       中括号内的点号按字面处理，故用 [zeek][id.orig_h] 取该字段。
filter {
  if [fields][log_source] == "zeek" {
    json {
      source => "message"
      target => "zeek"
      skip_on_invalid_json => true
    }

    if "_jsonparsefailure" not in [tags] {
      date {
        match => ["[zeek][ts]", "UNIX"]
        target => "@timestamp"
      }

      mutate {
        add_field => {
          "[event][module]"        => "zeek"
          "[event][kind]"          => "event"
          "[event][category]"      => "network"
          "[network][transport]"   => "%{[zeek][proto]}"
          "[network][protocol]"    => "%{[zeek][service]}"
          "[source][ip]"           => "%{[zeek][id.orig_h]}"
          "[source][port]"         => "%{[zeek][id.orig_p]}"
          "[destination][ip]"      => "%{[zeek][id.resp_h]}"
          "[destination][port]"    => "%{[zeek][id.resp_p]}"
          "[network][bytes]"       => "%{[zeek][orig_bytes]}"
        }
        convert => {
          "[source][port]"         => "integer"
          "[destination][port]"    => "integer"
          "[network][bytes]"       => "integer"
        }
      }

      geoip {
        source => "[zeek][id.orig_h]"
        target => "[source][geo]"
        tag_on_failure => ["_geoip_lookup_failure"]
      }
      # GeoIP 失败会残留空的 [source][geo]，geo_point 类型会拒绝空对象 → 移除
      if "_geoip_lookup_failure" in [tags] {
        mutate { remove_field => ["[source][geo]"] }
      }
    }

    mutate { remove_field => ["message"] }
  }
}
