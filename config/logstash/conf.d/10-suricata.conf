# Suricata eve.json → ECS 归一
# 职责：已知攻击实时告警（alert）+ DNS/HTTP/TLS/FILE 上下文事件
filter {
  if [fields][log_source] == "suricata" {
    json {
      source => "message"
      target => "eve"
      skip_on_invalid_json => true
    }

    if "_jsonparsefailure" not in [tags] {
      date {
        match => ["[eve][timestamp]", "ISO8601"]
        target => "@timestamp"
      }

      mutate {
        add_field => {
          "[event][module]"          => "suricata"
          "[event][dataset]"         => "suricata.eve"
          "[network][transport]"     => "%{[eve][proto]}"
          "[source][ip]"             => "%{[eve][src_ip]}"
          "[source][port]"           => "%{[eve][src_port]}"
          "[destination][ip]"        => "%{[eve][dest_ip]}"
          "[destination][port]"      => "%{[eve][dest_port]}"
        }
        convert => {
          "[source][port]"      => "integer"
          "[destination][port]" => "integer"
        }
      }

      if [eve][event_type] == "alert" {
        mutate {
          add_field => {
            "[event][kind]"      => "alert"
            "[event][category]"  => "intrusion_detection"
            "[event][type]"      => "indicator"
            "[rule][name]"       => "%{[eve][alert][signature]}"
            "[rule][id]"         => "%{[eve][alert][signature_id]}"
            "[rule][category]"   => "%{[eve][alert][category]}"
          }
        }
      } else {
        mutate {
          add_field => { "[event][kind]" => "event" }
        }
        if [eve][event_type] == "dns" {
          mutate { add_field => {
            "[event][category]"     => "network"
            "[dns][question][name]" => "%{[eve][dns][rrname]}"
          } }
        }
        if [eve][event_type] == "http" {
          mutate { add_field => {
            "[event][category]" => "web"
            "[url][domain]"     => "%{[eve][http][hostname]}"
            "[url][full]"       => "%{[eve][http][url]}"
          } }
        }
        if [eve][event_type] == "tls" {
          mutate { add_field => {
            "[event][category]"           => "network"
            "[tls][client][server_name]"  => "%{[eve][tls][sni]}"
          } }
        }
        if [eve][event_type] == "fileinfo" {
          mutate { add_field => {
            "[event][category]"   => "file"
            "[file][name]"        => "%{[eve][fileinfo][filename]}"
            "[file][hash][sha256]" => "%{[eve][fileinfo][sha256]}"
          } }
        }
      }

      geoip {
        source => "[eve][src_ip]"
        target => "[source][geo]"
        tag_on_failure => ["_geoip_lookup_failure"]
      }
      # GeoIP 失败会残留空的 [source][geo]，geo_point 类型会拒绝空对象 → 移除
      if "_geoip_lookup_failure" in [tags] {
        mutate { remove_field => ["[source][geo]"] }
      }
    }

    # 去掉体积大的原始字段，保留可检索的事件
    mutate {
      remove_field => ["message", "[eve][payload]", "[eve][payload_printable]", "[eve][packet]"]
    }
  }
}
