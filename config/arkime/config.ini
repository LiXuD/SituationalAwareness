# Arkime (Moloch) 配置 —— 一体化安全态势感知平台 POC
# 接入方式（I-02 §2.6）：直连同一 OpenSearch 集群，不走 Logstash 管道
# 适用镜像：ghcr.io/arkime/arkime/arkime:v5.4.0
#
# 关键约定：
#   - POC 的 OpenSearch 已关闭安全插件（DISABLE_SECURITY_PLUGIN=true），因此不配 basic auth
#   - Arkime 索引命名规则为 ${prefix}sessions3-YYYYMMDD（按日滚动）
#     验收要求 arkime_sessions3-* → 前缀必须为 arkime_（带下划线），而非 arkime
#   - Viewer 绑定 0.0.0.0:8005，宿主机端口映射 8005

[default]

# ============ 后端：OpenSearch（无鉴权） ============
db=opensearch
elasticsearch=http://opensearch:9200
# OpenSearch security 已关闭，留空即可；生产环境必须填 userName/password 并启用 TLS
userName=
password=

# ============ Viewer 鉴权 ============
# POC 关闭了 OpenSearch 安全插件 → OpenSearch 的 basic auth（elasticsearchBasicAuth /
# usersElasticsearchBasicAuth）保持为空（见上方 [default] 段），即 Arkime 直连 OS 无 OS 层鉴权。
# 但 Arkime Viewer 自身仍需登录用户：用 passwordSecret 对登录密码做哈希，再由
# scripts/arkime-init.sh 用 arkime_add_user.sh 创建管理员用户（写入 arkime_users_v30 内部用户库）。
# ⚠️ passwordSecret 与登录密码是两套东西：前者是哈希盐/密钥，后者是用户口令。
passwordSecret=ssp-poc-arkime-secret

# ============ 索引前缀 ============
# 会话索引 = arkime_sessions3-YYYYMMDD；users/sequence/stats 等辅助索引 = arkime_users 等
prefix=arkime_

# ============ Viewer（Web 检索界面） ============
viewerHost=0.0.0.0:8005

# ============ PCAP 落盘 ============
# 独立卷 arkime-pcap 挂载到容器内 /opt/arkime/pcap（与 os-data 分离）
pcapDir=/opt/arkime/pcap

# ============ 抓包接口 ============
# POC 单机用 capture -r 回放 pcap，不抓真实网卡；该值仅作占位
interface=eth0

# ============ 权限 ============
# 容器内以 root 运行并保留 root，规避 arkime 用户对 pcap 卷无写权限的问题（POC 简化）
dropUser=root

# ============ OpenSearch 兼容性 ============
# Arkime 5.x 原生支持 OpenSearch（db=opensearch），OS 2.13 在支持矩阵内，无需额外开关
# 如后续遇到版本探测告警，可取消下行注释：
# skipVersionCheck=true
