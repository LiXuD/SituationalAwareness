# Filebeat —— 只负责"投递"，不做 ECS 归一（归一统一交给 Logstash）
# 每个探针的原始日志通过 fields.log_source 打标，Logstash 据此分流与映射。
filebeat.inputs:
  - type: filestream
    id: suricata-eve
    enabled: true
    paths:
      - /var/log/probes/suricata/eve.json
    fields:
      log_source: suricata
      branch: hq
      branch_site: 总部

  - type: filestream
    id: zeek-logs
    enabled: true
    paths:
      - /var/log/probes/zeek/*.log
    exclude_lines: ['^#']            # 跳过 Zeek 的 #separator/#set_separator/#fields 等头部行
    fields:
      log_source: zeek
      branch: hq
      branch_site: 总部

  - type: filestream
    id: wazuh-alerts
    enabled: true
    paths:
      - /var/log/probes/wazuh/alerts.json
    fields:
      log_source: wazuh
      branch: hq
      branch_site: 总部

# ---------------------------------------------------------------------------
# 演示数据集回放（I-07/I-08）
# 源数据集在 logs/demo/（真实公网 IP、可地理定位），但**不直接采集**；
# 由 scripts/replay-demo.sh 复制到暂存区 logs/demo-stage/ 后才被采集，
# 使"回放"成为一个显式动作，生产链路保持只吃真实探针日志。
# 演示事件带 fields.demo="true" 标记，便于 scripts/reset-demo.sh 精准清理。
# ---------------------------------------------------------------------------
  - type: filestream
    id: demo-suricata
    enabled: true
    paths:
      - /var/log/probes/demo-stage/suricata/*.json
    fields:
      log_source: suricata
      branch: hq
      branch_site: 总部
      demo: "true"

  - type: filestream
    id: demo-zeek
    enabled: true
    paths:
      - /var/log/probes/demo-stage/zeek/*.log
    exclude_lines: ['^#']
    fields:
      log_source: zeek
      branch: hq
      branch_site: 总部
      demo: "true"

  - type: filestream
    id: demo-wazuh
    enabled: true
    paths:
      - /var/log/probes/demo-stage/wazuh/*.json
    fields:
      log_source: wazuh
      branch: hq
      branch_site: 总部
      demo: "true"

# 注：Arkime 不走此管道——它以全流量存储为主，直接写入同一个 OpenSearch 集群（见技术方案 §5）

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded

# 中心汇聚层：投递到 Kafka 的 ssp-raw 主题（I-13 多分支汇聚）
# 总部（hq）与各分支机构用同一个主题，靠 fields.branch 区分——
# 中心无需为每个分支开端口，新增分支不改中心侧配置。
output.kafka:
  hosts: ["kafka:9092"]
  topic: "ssp-raw"
  required_acks: 1
  compression: gzip

logging.level: info
logging.to_files: false
