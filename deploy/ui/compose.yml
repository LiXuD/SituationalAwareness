# 展示层：平台 Web 入口（nginx 静态工程 + /api 同源反代到 portal）
#
# 浏览器只访问 http://localhost:8088（单一源）；API 经 nginx 反代，会话 Cookie 为一方 Cookie。
services:
  ui:
    image: nginx:1.27-alpine
    container_name: ssp-ui
    volumes:
      # 静态工程（只读）：ui/ -> /usr/share/nginx/html
      - ../../ui:/usr/share/nginx/html:ro
      # 站点配置：静态托管 + /api 反代到平台统一后端
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - portal
    networks: [ssp]
    restart: unless-stopped
