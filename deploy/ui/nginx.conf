# 平台 Web 入口（nginx）——静态工程 + 同源 API 反代
#
# 设计：浏览器**只访问 http://localhost:8088 这一个源**。
#   /           → ui/ 静态工程（登录页 + app 壳 + src 模块）
#   /api/       → 反代到平台统一后端 portal:8093
#
# 为什么要同源反代：会话 Cookie 若是跨源（8088 → 8093）会受 SameSite/CORS 限制，
# 必须配 CORS allow-credentials + SameSite=None + Secure，在 http 下很别扭；
# 同源反代后 Cookie 是**一方 Cookie**，前端代码里也不需要再写任何端口。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 平台统一后端
    # 用变量 + resolver 动态解析 portal（Docker 内置 DNS），避免 portal 重启/重建后
    # nginx 缓存旧 IP 导致 502（此前需手动重启 nginx 才恢复，valid=10s 后自动恢复）。
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $portal_upstream "portal:8093";
        proxy_pass http://$portal_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;          # PCAP 导出可能较慢
        proxy_buffering off;              # 大文件（pcap）流式转发
    }

    # 静态工程：ES 模块需要正确的 MIME 与可缓存策略
    location ~* \.(?:js|mjs|css|svg|json|png|jpg|ico|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
