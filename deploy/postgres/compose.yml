# PostgreSQL（可选后端）—— 业务量大时把平台业务库从 SQLite 切到 PG
#
# 默认**不启动**（profile: postgres）。启用步骤：
#   1) 启动 PG：      docker compose --profile postgres up -d postgres
#   2) 初始化业务表： PLATFORM_DB=postgresql://ssp:REDACTED-PG-PWD@localhost:5432/ssp \
#                     python3 scripts/init-db.py
#   3) 切 portal：    把 deploy/portal/compose.yml 的 PLATFORM_DB 设为
#                     postgresql://ssp:REDACTED-PG-PWD@postgres:5432/ssp 并重启 portal
#   （portal 镜像已预装 psycopg 驱动，业务代码零改动）
#
# 相对路径以本文件所在目录为基准：deploy/postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: ssp-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=ssp
      - POSTGRES_PASSWORD=REDACTED-PG-PWD
      - POSTGRES_DB=ssp
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"          # 宿主 5433（避免与宿主已有 PG 的 5432 冲突）；容器间走 postgres:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssp -d ssp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ssp]
    restart: unless-stopped

volumes:
  pg-data:
