# I-06 统一资产库 —— 资产服务（纯标准库 Python，零第三方依赖）
# 相对路径以本文件所在目录为基准：deploy/asset
services:
  asset:
    image: python:3.12-slim
    container_name: ssp-asset
    command: python3 /srv/asset_server.py
    environment:
      - OS_URL=http://opensearch:9200      # 同一 OpenSearch 集群（容器内域名）
      - ASSET_INDEX=ssp-asset
      - ASSET_ALIAS=ssp-assets
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=8090
      - CORS_ALLOW_ORIGIN=*
    volumes:
      # 服务代码（只读）：services/asset -> /srv
      - ../../services/asset:/srv:ro
      # 宿主 bind mount 持久化（POC 不引入新根级 volume）：services/asset/data -> /srv/data
      - ../../services/asset/data:/srv/data
    ports:
      - "8090:8090"
    depends_on:
      - opensearch
    networks: [ssp]
    restart: unless-stopped
