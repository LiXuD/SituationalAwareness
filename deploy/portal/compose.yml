# 平台统一后端（BFF）—— 把第三方组件（Arkime 流量回溯）的能力收进平台
#
# 为什么需要它：Arkime Viewer 用 **digest 鉴权** 且 **不发 CORS 头**，浏览器无法直接调用；
# 若前端直连就只能是"跳去 Arkime 自己的控制台"。本服务在服务端完成鉴权与转发，
# 前端只访问 http://localhost:8093/api/traffic/*，实现"统一管理查看、不跳转"。
#
# 相对路径以本文件所在目录为基准：deploy/portal
services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssp-portal:latest
    container_name: ssp-portal
    command: python3 /srv/portal_server.py
    environment:
      - PORTAL_PORT=8093
      # 业务库：SQLite（默认）；切换 PostgreSQL 时改为 postgresql://user:pass@host:5432/ssp
      - PLATFORM_DB=sqlite:////data/ssp.db
      - SESSION_TTL_SECONDS=28800              # 会话 8 小时
      - DISCOVERY_INTERVAL_SECONDS=3600        # I-12 资产测绘定时执行（秒）；0=关闭
      - BRANCH_HEALTH_INTERVAL_SECONDS=300     # I-13 分支汇聚健康探测（秒）；0=关闭
      # 平台内部上游：浏览器只连 :8088（nginx），/api 反代到这里；以下组件均为内部数据源
      - OPENSEARCH_URL=http://opensearch:9200
      - CORRELATOR_URL=http://correlator:8091
      - ASSET_URL=http://asset:8090
      - SOAR_URL=http://soar:8092
      - ARKIME_URL=http://arkime:8005         # 容器网络内直连 Arkime Viewer
      # 口令来自 deploy/.env（compose 自动读取本目录下的 .env）——仓库内不留任何默认口令；
      # 未配置时**直接报错**（而非退化成弱口令）。首次使用：make init / cp deploy/.env.example deploy/.env
      - ARKIME_USER=${ARKIME_ADMIN_USER:-admin}
      - ARKIME_PASS=${ARKIME_ADMIN_PASSWORD:?未设置 Arkime 口令：请在 deploy/.env 配置 ARKIME_ADMIN_PASSWORD（可先执行 make init）}
    volumes:
      # 服务代码（只读）：services/portal -> /srv
      - ../../services/portal:/srv:ro
      # 业务数据库（可写持久化）：宿主机 data/ -> 容器 /data（ssp.db 不随容器重建丢失）
      - ../../data:/data
    ports:
      - "8093:8093"
    depends_on:
      - arkime
      - opensearch
      - correlator
      - soar
    networks: [ssp]
    restart: unless-stopped
