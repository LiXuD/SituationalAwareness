# PostgreSQL 模式 override —— 把平台业务库从 SQLite 切到 PostgreSQL。
#
# 用法：
#   1) make pg-up          # 起 PG（口令取自 deploy/.env）
#   2) make pg-init        # 建表 + 种子（脚本用 deploy/.env 拼 DSN）
#   3) make pg-portal      # 把 portal 切到 PG
#
# 说明：portal 镜像已预装 psycopg，业务代码零改动；本 override 只覆盖 PLATFORM_DB。
#       密码由 compose 从 deploy/.env 插值（`POSTGRES_PASSWORD`），仓库内不留默认值。
# 相对路径以本文件所在目录为基准：deploy/portal
services:
  portal:
    environment:
      - PLATFORM_DB=postgresql://${POSTGRES_USER:-ssp}:${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD：见 deploy/.env}@postgres:5432/${POSTGRES_DB:-ssp}
